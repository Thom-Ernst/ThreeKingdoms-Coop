name: Install pinned Inno Setup
description: SHA256-verified Inno Setup 6.7.3 in the per-user compiler location
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
        Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
        if ((Get-FileHash $download -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Inno Setup download hash mismatch.' }
        $target = Join-Path $env:LOCALAPPDATA 'Programs/Inno Setup 6'
        $process = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="' + $target + '"')) -PassThru -Wait -WindowStyle Hidden
        if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $target 'ISCC.exe'))) { throw 'Inno Setup installation failed.' }
